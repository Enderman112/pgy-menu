name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            args: '--bundles app,dmg'
          - name: Windows
            os: windows-latest
            args: '--bundles msi,nsis'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'PGY Menu ${{ github.ref_name }}'
          releaseBody: |
            ## PGY Menu ${{ github.ref_name }}

            给 PGY / X4U 系列随身 WiFi 做的桌面客户端（Tauri 2）。

            - macOS：`.dmg` / `.app`（未签名，首次打开需右键 →「打开」）
            - Windows：`.msi` / `.nsis` 安装包（未签名，可能提示 SmartScreen）

            设备接口说明见仓库 `docs/DEVICE_API.md`。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
